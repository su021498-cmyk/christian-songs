<!DOCTYPE html>
<html>
<head>
    <title>Christian Songs</title>
    <style>
        body {
            font-family: Arial;
            background: #0b1d2a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: gold;
        }
        .song {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        .lyrics {
            white-space: pre-line;
            margin-top: 10px;
        }
        audio {
            width: 80%;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>✝ Christian Songs ✝</h1>

<div class="song">
    <h2>My Song</h2>
    <p>Artist Name</p>

    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="lyrics">
Line 1 of lyrics
Line 2 of lyrics
Line 3 of lyrics
    </div>
</div>

</body>
</html>
